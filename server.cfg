# Hunter3D dedicated server configuration
# Copied next to sever.exe on first build; edit the copy in bin/.
#
# difficulty: normal | hard
# bots:       on | off   (two AI allies simulated on the server)
# autostart:  on | off   (listen as soon as the server opens)
# web:        on | off   (built-in install page + APK download for phones)
# web_port:   TCP port for the install page
# web_root:   folder with index.html and app\Hunter3D-lan.apk

difficulty=normal
bots=off
autostart=on
web=on
web_port=8080
web_root=..\..\Instail
